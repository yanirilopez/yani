<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial</title>
    <style>
        /* Reseteo básico de márgenes */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Estructura en pantalla completa */
        body {
            display: flex;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Área del menú (Panel izquierdo) */
        nav {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
        }

        nav a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px 0;
            border-bottom: 1px solid #34495e;
        }

        nav a:hover {
            color: #3498db;
        }

        /* Área de contenido (Panel derecho con iframe) */
        main {
            flex: 1;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Panel Lateral / Menú -->
    <nav>
        <h2>Menú</h2>
        <!-- El atributo 'target' le dice al enlace en qué iframe abrir el contenido -->
        <a href="principito.html" target="visor_contenido">Inicio</a>
        <a href="Video.html" target="visor_contenido">Acerca de</a>
       
    </nav>

    <!-- Área donde se cargan las otras páginas -->
    <main>
        <iframe src="inicio.html" name="visor_contenido" title="Contenido Principal"></iframe>
    </main>

</body>
</html
